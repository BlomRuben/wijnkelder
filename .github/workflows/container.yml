# Bouwt bij elke push naar main een nieuwe container-image en zet die op
# ghcr.io/<gebruikersnaam>/<repo>. Unraid haalt die image op.
name: Container bouwen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io accepteert alleen kleine letters in de naam van een image
      - name: Naam van de image bepalen
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 'latest' is altijd de nieuwste versie; de commit-code maakt teruggaan naar
      # een eerdere versie mogelijk
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
